name: Tag and Release

on:
  # Release after every push to main that passes the Test workflow, so a
  # merged change reaches the registry without waiting for the monthly run.
  # The release waits for Test and tags exactly the commit Test checked.
  # It releases everything since the last tag, once per push.
  #
  # The tag action (default_bump: false) bumps only when a commit since the
  # last tag asks for it: feat: (minor), fix: (patch), or a breaking change
  # marker such as feat!: or a BREAKING CHANGE footer (major). Pushes with
  # only docs:, chore: or ci: commits release nothing. GitHub's default
  # revert message ("Revert ...") releases nothing either, so write a revert
  # that must ship as "fix: revert ...".
  #
  # The tag this workflow pushes uses GITHUB_TOKEN, which starts no new
  # workflow runs, so a release does not trigger itself.
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 0 5 * *'
  workflow_dispatch:

# Two runs close together must not race to compute the same next tag, so
# they run one at a time. A running release is never cancelled, because a
# cancelled run could leave a tag without its release or registry entry.
# GitHub keeps at most one run waiting: a newer one replaces it. Nothing is
# lost by that, because each run releases every commit since the last tag.
concurrency:
  group: tag-and-release
  cancel-in-progress: false

jobs:
  # The scheduled run used to bump a version whether or not anything had
  # landed, so the same tree was released again and again (see the tags that
  # share one commit). This job asks the only question that matters -- did
  # anything get committed since the last release? -- and every job below
  # hangs off the answer.
  check:
    # On workflow_run, release only after Test passed on a push to main.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit Test checked, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history and tags: `git describe` needs both, and the default
          # shallow checkout has neither.
          fetch-depth: 0
      - name: Look for commits since the last release
        id: changes
        run: |
          set -o errexit -o nounset -o pipefail
          latest="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "${latest}" ]; then
            echo "No tag yet; releasing."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "$(git rev-list -n 1 "${latest}")" = "$(git rev-parse HEAD)" ]; then
            echo "HEAD is already released as ${latest}. Nothing to release."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          elif git merge-base --is-ancestor HEAD "${latest}"; then
            # A re-run of an older run, after a newer commit was released.
            # Tagging this commit would give an older tree a higher version.
            echo "HEAD is older than the release ${latest}. Nothing to release."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "$(git rev-list --count "${latest}"..HEAD) commit(s) since ${latest}; releasing."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  tag:
    needs: check
    if: ${{ needs.check.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Tag the commit Test checked. On workflow_run, GITHUB_SHA is main's
          # newest commit, which may be newer and untested.
          commit_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
          release_branches: main
          # Without this the action bumps the patch version on every run, even
          # when no commit landed since the last tag. The cron then released the
          # same tree again and again. `false` makes the action emit an empty
          # `new_tag` when no commit asks for a release, and the guards below
          # then skip the release and the publication.
          default_bump: false
      - name: Create a GitHub release
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          generateReleaseNotes: true
      - name: Get release tag
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        id: get_version
        run: echo "VERSION=${{ steps.tag_version.outputs.new_tag }}" >> $GITHUB_ENV
      - name: Get repo name
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        id: get_repo_name
        run: echo "REPO_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV
      - name: "Publish source archive"
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: "${{ env.REPO_NAME }}-${{ env.VERSION }}.zip"
          exclusions: '*.git* /*node_modules/* .editorconfig /bazel-*'
      - name: "Upload source archive"
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          allowUpdates: true
          artifacts: "${{ env.REPO_NAME }}-${{ env.VERSION }}.zip"

  publish:
    needs: tag
    if: ${{ needs.tag.outputs.tag_name != '' }}
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
    secrets:
      BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}

