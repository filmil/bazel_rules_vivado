name: Tag and Release

on:
  # Release after every push to main, once the Test workflow has passed
  # for it, so a merged change reaches the registry without waiting for
  # the monthly run. Every run, whatever started it, releases main's
  # current head, and only if Test passed on a push of that exact commit.
  # A run for an older commit, a failed Test run, or a run started after
  # main moved on releases nothing; the newest push's own run does it.
  #
  # The tag action (default_bump: false) bumps only when a commit since the
  # last tag asks for it: feat: (minor), fix: (patch), or a breaking change
  # marker such as feat!: or a BREAKING CHANGE footer (major). Pushes with
  # only docs:, chore: or ci: commits release nothing. GitHub's default
  # revert message ("Revert ...") releases nothing either, so write a revert
  # that must ship as "fix: revert ...".
  #
  # The tag this workflow pushes uses GITHUB_TOKEN, which starts no new
  # workflow runs, so a release does not trigger itself.
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 0 5 * *'
  workflow_dispatch:

jobs:
  # Decides whether to release, and what: main's head, if Test passed on a
  # push of it, and if no tag is on it yet. The scheduled run used to bump a
  # version whether or not anything had landed; this job also stops that.
  check:
    # A failed or cancelled Test run, or one not started by a push, needs
    # no release run at all.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      sha: ${{ steps.changes.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history and tags: `git describe` needs both, and the default
          # shallow checkout has neither.
          fetch-depth: 0
      - name: Decide whether main's head is released, tested and new
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -o errexit -o nounset -o pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          if [ -n "${RUN_SHA}" ] && [ "${RUN_SHA}" != "${sha}" ]; then
            echo "Test ran on ${RUN_SHA}, but main is now ${sha}. The newer push releases."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          passed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?head_sha=${sha}&event=push&status=success" --jq '.total_count')"
          if [ "${passed}" -eq 0 ]; then
            echo "Test has not passed on a push of ${sha}. Nothing to release."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          latest="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "${latest}" ]; then
            echo "No tag yet; releasing."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          elif [ "$(git rev-list -n 1 "${latest}")" = "${sha}" ]; then
            echo "${sha} is already released as ${latest}. Nothing to release."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "$(git rev-list --count "${latest}"..HEAD) commit(s) since ${latest}; releasing."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  tag:
    needs: check
    if: ${{ needs.check.outputs.changed == 'true' }}
    # Releases run one at a time, so two cannot compute the same next tag.
    # Only this job queues, so failed Test runs never take a queue place.
    # A running release is never cancelled: that could leave a tag without
    # its release or registry entry. GitHub keeps at most one release
    # waiting, and a newer one replaces it; nothing is lost, because every
    # release covers main's head and all commits since the last tag.
    concurrency:
      group: tag-and-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: main
      - name: Confirm main has not moved since the check
        id: same
        env:
          CHECKED: ${{ needs.check.outputs.sha }}
        run: |
          now="$(git rev-parse HEAD)"
          if [ "${now}" = "${CHECKED}" ]; then
            echo "ok=true" >> "${GITHUB_OUTPUT}"
          else
            echo "main moved from ${CHECKED} to ${now}; its own run releases it."
            echo "ok=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Bump version and push tag
        id: tag_version
        if: ${{ steps.same.outputs.ok == 'true' }}
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The commit the check found tested; on workflow_run, GITHUB_SHA
          # may be newer.
          commit_sha: ${{ needs.check.outputs.sha }}
          release_branches: main
          # Without this the action bumps the patch version on every run, even
          # when no commit landed since the last tag. The cron then released the
          # same tree again and again. `false` makes the action emit an empty
          # `new_tag` when no commit asks for a release, and the guards below
          # then skip the release and the publication.
          default_bump: false
      - name: Create a GitHub release
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          generateReleaseNotes: true
      - name: Get release tag
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        id: get_version
        run: echo "VERSION=${{ steps.tag_version.outputs.new_tag }}" >> $GITHUB_ENV
      - name: Get repo name
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        id: get_repo_name
        run: echo "REPO_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV
      - name: "Publish source archive"
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: "${{ env.REPO_NAME }}-${{ env.VERSION }}.zip"
          exclusions: '*.git* /*node_modules/* .editorconfig /bazel-*'
      - name: "Upload source archive"
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          allowUpdates: true
          artifacts: "${{ env.REPO_NAME }}-${{ env.VERSION }}.zip"

  publish:
    needs: tag
    if: ${{ needs.tag.outputs.tag_name != '' }}
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
    secrets:
      BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}

